<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copilot Workshop — Idea Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1>M365 Copilot Workshop <span>· Idea Board</span></h1>
    <div class="topbar-actions">
      <button id="exportBtn" class="btn">Export JSON</button>
      <button id="exportCsvBtn" class="btn">Export CSV</button>
      <label class="btn file-btn">Import JSON
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
      <button id="printBtn" class="btn">Print Showcase Cards</button>
    </div>
  </div>
</header>

<main>
  <section class="panel form-panel">
    <h2>Capture an idea</h2>
    <form id="ideaForm">
      <label>Group / Team name
        <input type="text" id="groupName" placeholder="e.g. Lettings Team" required>
      </label>

      <label>Topic
        <select id="topic" required>
          <option value="">Select a topic…</option>
          <option>Copilot in the web</option>
          <option>Copilot within M365 apps</option>
          <option>Agents built by standard Copilot</option>
          <option>Advanced agents &amp; workflows (Copilot Studio)</option>
          <option>Application development &amp; reporting (GitHub Copilot)</option>
        </select>
      </label>

      <label>Idea title
        <input type="text" id="title" placeholder="Short, punchy name for the idea" required>
      </label>

      <label>Business goal it supports
        <input type="text" id="businessGoal" placeholder="e.g. Faster lead response time">
      </label>

      <label>Description / how it works
        <textarea id="description" rows="3" placeholder="What problem does it solve? How would Copilot be used?"></textarea>
      </label>

      <label>Estimated impact / effort notes
        <input type="text" id="impact" placeholder="e.g. High impact, low effort — quick win">
      </label>

      <label>Status
        <select id="status">
          <option value="idea">Idea only</option>
          <option value="shortlisted">Shortlisted — build a demo</option>
        </select>
      </label>

      <div id="demoFields" class="demo-fields hidden">
        <label>Demo scenario / test plan
          <textarea id="demoPlan" rows="2" placeholder="What will be demoed? What data/steps are needed?"></textarea>
        </label>
        <label>Presenter(s)
          <input type="text" id="presenter" placeholder="Who will present this at the showcase?">
        </label>
      </div>

      <button type="submit" class="btn btn-primary">Add idea</button>
    </form>
  </section>

  <section class="panel board-panel">
    <div class="board-controls">
      <h2>Ideas</h2>
      <div class="filters">
        <select id="filterTopic">
          <option value="">All topics</option>
        </select>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="idea">Idea only</option>
          <option value="shortlisted">Shortlisted</option>
        </select>
        <span id="countSummary" class="count-summary"></span>
      </div>
    </div>

    <div class="columns">
      <div class="column">
        <h3>💡 Idea only <span id="ideaCount" class="badge"></span></h3>
        <div id="ideaColumn" class="card-list"></div>
      </div>
      <div class="column">
        <h3>⭐ Shortlisted — demo scenario <span id="shortlistCount" class="badge"></span></h3>
        <div id="shortlistColumn" class="card-list"></div>
      </div>
    </div>
  </section>
</main>

<div id="printArea" class="print-only"></div>

<script src="app.js"></script>
</body>
</html>
